name: CI / Deploy klomang

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: beresin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The smoke test runs the built image, and the public pages (`/`, `/articles`,
    # `/portfolio`, `/sitemap.xml`) are server-rendered from Postgres — with no
    # database they answer 500 and the test proves nothing. This service gives CI
    # the same shape as production, where the app talks to a real Postgres.
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: beresin
          POSTGRES_USER: beresin
          POSTGRES_PASSWORD: beresin
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -U beresin -d beresin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - name: Build and verify HTML
        env:
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_GA4_MANUAL_EVENTS: ${{ vars.PUBLIC_GA4_MANUAL_EVENTS }}
        run: docker build --build-arg PUBLIC_GA4_ID="$PUBLIC_GA4_ID" --build-arg PUBLIC_GA4_MANUAL_EVENTS="$PUBLIC_GA4_MANUAL_EVENTS" -t "beresin:$GITHUB_SHA" .

      # Migrations run through the image itself, exactly as deploy.sh does in
      # production — so the schema the smoke test exercises is the one the image
      # ships, not whatever the runner's checkout happens to contain.
      #
      # The service publishes 5432 on the runner, and `host-gateway` is how the
      # nested container reaches it (the runner's own `localhost` is not visible
      # from inside a sibling container).
      - name: Apply migrations
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e DB_HOST=host.docker.internal -e DB_PORT=5432 \
            -e DB_NAME=beresin -e DB_USER=beresin -e DB_PASSWORD=beresin \
            "beresin:$GITHUB_SHA" \
            node node_modules/drizzle-kit/bin.cjs migrate

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 4321:4321 \
            --add-host=host.docker.internal:host-gateway \
            -e DB_HOST=host.docker.internal -e DB_PORT=5432 \
            -e DB_NAME=beresin -e DB_USER=beresin -e DB_PASSWORD=beresin \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e LEAD_IP_HMAC_SECRET="$(openssl rand -hex 32)" \
            "beresin:$GITHUB_SHA"
          # Wait on `/`, not `/admin/login`: the login form renders without the
          # database, so it would report "ready" while every content page was
          # still failing. `/` only answers 200 once the DB is reachable and
          # migrated, which is the readiness that actually matters here.
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4321/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/verify-deploy.mjs
      - name: Server logs
        if: failure()
        run: docker logs smoke || true
      - name: Export image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: docker save "beresin:$GITHUB_SHA" | gzip > image.tar.gz
      - name: Deploy via SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          SSH_KEY: ${{ secrets.KLOMANG_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KLOMANG_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.KLOMANG_HOST }}
          SSH_USER: ${{ vars.KLOMANG_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$SSH_USER@$SSH_HOST"
          release="/home/moon/apps/beresin/releases/$GITHUB_SHA"
          ssh "$target" "mkdir -p '$release'"
          scp image.tar.gz deploy/compose.yml deploy/init-db.sh deploy/deploy.sh "$target:$release/"
          ssh "$target" "set -e; docker load -i '$release/image.tar.gz'; bash '$release/deploy.sh' 'beresin:$GITHUB_SHA'; rm '$release/image.tar.gz'"
      # Runner GitHub diblokir Cloudflare Bot Fight Mode (Free, tidak bisa
      # di-skip oleh WAF/Page Rule) — check publik dari runner selalu 403.
      # Check pindah ke klomang via SSH yang sudah dipakai step deploy, dengan
      # --resolve ke NPM lokal sehingga melewati Cloudflare sepenuhnya.
      - name: Check prod origin via SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          SSH_KEY: ${{ secrets.KLOMANG_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KLOMANG_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.KLOMANG_HOST }}
          SSH_USER: ${{ vars.KLOMANG_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$SSH_USER@$SSH_HOST"
          scp scripts/check-prod-origin.sh "$target:/tmp/check-prod-origin.sh"
          ssh "$target" "bash /tmp/check-prod-origin.sh; rc=$?; rm -f /tmp/check-prod-origin.sh; exit $rc"
